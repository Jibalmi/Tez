[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tez-decisions"
version = "0.1.0"
description = "Tez: an open, local System One decision engine with a Jev-compatible /v1/systemone server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "classification", "decisions", "llama.cpp", "calibration", "conformal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
fit = ["scikit-learn>=1.2"]
truncate = ["gguf>=0.10"]
test = ["pytest>=7", "httpx>=0.24", "scikit-learn>=1.2"]

[project.scripts]
tez = "tez.cli:main"

[tool.setuptools.packages.find]
include = ["tez", "tez.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs a llama-server on http://127.0.0.1:8091 (skipped when unreachable)"]
